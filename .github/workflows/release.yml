name: Release

on:
    push:
        tags: ["*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              # Same pin as the test workflow so the released bundle is built by
              # the toolchain the tests were run against.
              with:
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile

            # Every gate below runs against this exact artifact — the one that
            # gets uploaded. 0.1.0-alpha.3 shipped a bundle that could not be
            # loaded at all because nothing in this workflow ever inspected the
            # built output, only the sources it came from.
            - name: Build
              run: npm run build

            - name: Check bundle for loader-incompatible constructs
              run: npm run check:bundle

            # The copy tables are the single source for every user-visible
            # string; this catches the ones that never got there. Two branches
            # have shipped hardcoded English past review, and the ContextRow
            # case was six `aria-label`s — invisible on screen, and asserted in
            # English by the component's own passing tests.
            - name: Check for hardcoded user-visible copy
              run: npm run check:copy

            # Includes the smoke test that evaluates main.js the way Obsidian
            # does and runs onload on both desktop and mobile platform shapes.
            - name: Test
              run: bun test

            - name: Lint
              run: npm run lint

            - name: Verify manifest version matches the tag
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
                  if [ "$TAG" != "$MANIFEST_VERSION" ]; then
                      echo "Tag $TAG does not match manifest.json version $MANIFEST_VERSION"
                      exit 1
                  fi

            - name: Package plugin files
              run: |
                  mkdir dist
                  cp main.js manifest.json styles.css dist/

            # The gates above ran against the repo-root main.js; assert the copy
            # in dist/ is byte-identical, so what ships is what was verified.
            - name: Verify packaged bundle matches the verified build
              run: |
                  if ! cmp -s main.js dist/main.js; then
                      echo "dist/main.js differs from the verified main.js"
                      exit 1
                  fi
                  node scripts/check-bundle.mjs dist/main.js

            - uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
                  generate_release_notes: true
