name: Release

on:
    push:
        tags: ["*"]

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              # Same pin as the test workflow so the released bundle is built by
              # the toolchain the tests were run against.
              with:
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile
            - run: bun test
            - run: npm run build
            - name: Verify manifest version matches the tag
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
                  if [ "$TAG" != "$MANIFEST_VERSION" ]; then
                      echo "Tag $TAG does not match manifest.json version $MANIFEST_VERSION"
                      exit 1
                  fi
            - name: Package plugin files
              run: |
                  mkdir dist
                  cp main.js manifest.json styles.css dist/
            - uses: softprops/action-gh-release@v2
              with:
                  files: |
                      dist/main.js
                      dist/manifest.json
                      dist/styles.css
                  generate_release_notes: true
