name: Build and test

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]
    # Lets the gate be run on demand, which is also the only way to trigger it
    # on a fork until Actions is enabled once in the repository UI.
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  # Pinned so CI and local runs agree. An unpinned setup-bun
                  # installs the newest release, which is how a mock-ordering
                  # bug reached CI while every local run stayed green.
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile
            - run: bun test
            - run: npm run build
            - run: npm run lint
