name: Build and test

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]
    # Lets the gate be run on demand, which is also the only way to trigger it
    # on a fork until Actions is enabled once in the repository UI.
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
              with:
                  # Pinned so CI and local runs agree. An unpinned setup-bun
                  # installs the newest release, which is how a mock-ordering
                  # bug reached CI while every local run stayed green.
                  bun-version: 1.4.0
            - run: bun install --frozen-lockfile

            # Build first: the bundle gates below assert on main.js, and
            # `bun test` includes a smoke test that loads that artifact. Running
            # tests before the build would silently check a stale bundle — or
            # none at all on a clean checkout.
            - name: Build
              run: npm run build

            # Catches constructs Obsidian's eval-based loader cannot handle, such
            # as the `import("electron")` that shipped in 0.1.0-alpha.3.
            - name: Check bundle for loader-incompatible constructs
              run: npm run check:bundle

            - name: Test
              run: bun test

            - name: Lint
              run: npm run lint
