name: Build and test

on:
    push:
        branches: ["**"]
    pull_request:
        branches: ["**"]
    # Lets the gate be run on demand, which is also the only way to trigger it
    # on a fork until Actions is enabled once in the repository UI.
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4
            - name: Use Bun
              uses: oven-sh/setup-bun@v2
            - run: bun install --frozen-lockfile
            - run: bun test
            - run: npm run build
            - run: npm run lint
